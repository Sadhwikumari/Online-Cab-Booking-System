<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed - CabRide</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .confirmation-page {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            background: #f7f8fa;
        }

        .confirmation-card {
            width: 500px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e9f8ed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .confirmation-card h1 {
            margin-bottom: 10px;
        }

        .confirmation-card > p {
            color: #777;
            margin-bottom: 25px;
        }

        .booking-details {
            text-align: left;
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-row span:first-child {
            color: #777;
        }

        .detail-row span:last-child {
            font-weight: bold;
        }

        .status {
            color: #16803c;
        }

        .confirmation-actions {
            display: flex;
            gap: 12px;
        }

        .confirmation-actions button {
            flex: 1;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .home-btn {
            background: #222;
            color: white;
            border: none;
        }

        .rides-btn {
            background: #f5b400;
            border: none;
        }

        @media (max-width: 500px) {
            .confirmation-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            🚕 <span>CabRide</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="book-ride.html">Book Ride</a>
            <a href="my-rides.html">My Rides</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- CONFIRMATION -->

    <main class="confirmation-page">

        <div class="confirmation-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>Ride Booked Successfully!</h1>

            <p>
                Your cab has been booked successfully.
            </p>


            <!-- BOOKING DETAILS -->

            <div class="booking-details">

                <div class="detail-row">
                    <span>Booking ID</span>
                    <span id="bookingId">---</span>
                </div>

                <div class="detail-row">
                    <span>Pickup</span>
                    <span id="pickup">---</span>
                </div>

                <div class="detail-row">
                    <span>Destination</span>
                    <span id="drop">---</span>
                </div>

                <div class="detail-row">
                    <span>Cab Type</span>
                    <span id="cabType">---</span>
                </div>

                <div class="detail-row">
                    <span>Distance</span>
                    <span id="distance">---</span>
                </div>

                <div class="detail-row">
                    <span>Total Fare</span>
                    <span id="fare">---</span>
                </div>

                <div class="detail-row">
                    <span>Status</span>
                    <span class="status" id="status">
                        Confirmed
                    </span>
                </div>

            </div>


            <!-- BUTTONS -->

            <div class="confirmation-actions">

                <button
                    class="home-btn"
                    onclick="window.location.href='index.html'">

                    Back to Home

                </button>

                <button
                    class="rides-btn"
                    onclick="window.location.href='my-rides.html'">

                    View My Rides

                </button>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        const bookingData =
            JSON.parse(localStorage.getItem("latestBooking"));


        if (!bookingData) {

            alert("No booking information found.");

            window.location.href = "index.html";

        } else {

            document.getElementById("bookingId").innerText =
                bookingData.bookingId;

            document.getElementById("pickup").innerText =
                bookingData.pickup;

            document.getElementById("drop").innerText =
                bookingData.drop;

            document.getElementById("cabType").innerText =
                bookingData.cabType;

            document.getElementById("distance").innerText =
                bookingData.distance + " KM";

            document.getElementById("fare").innerText =
                "₹" + Number(bookingData.fare).toFixed(0);

            document.getElementById("status").innerText =
                bookingData.status;
        }

    </script>

</body>
</html>
